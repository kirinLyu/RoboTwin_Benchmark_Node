manifest_version: 2
name: robotwin-benchmark
version: 0.1.0
description: Run the ROBOTWIN benchmark through Forge Query/Session tools.
skill_document: SKILL.md
gateway_url: http://127.0.0.1:19132
required_tools:
- robotwin.benchmark.describe
- robotwin.benchmark.run
- robotwin.policy.describe
profiles:
  g05_external:
    dataflow: profiles/g05_external/dataflow.yaml
    startup_timeout_s: 900
    required_binaries:
    - gateway
    - robotwin_benchmark
    - robotwin_policy
    required_assets:
    - profiles/g05_external/gateway.yaml
    - profiles/g05_external/benchmark.yaml
    - profiles/g05_external/policy.yaml
    required_environment:
    - ROBOTWIN_ROOT
    - ROBOTWIN_ENV_SITE
    - ROBOTWIN_PYTHON
    - G05_SERVER_URL
    - CUDA_VISIBLE_DEVICES
    environment:
      PYOPENGL_PLATFORM: egl
      MUJOCO_GL: egl
artifacts:
  resolver: registry
  nodes:
    gateway:
      artifact_id: gateway-1.1.0-linux-x86_64
      version: 1.1.0
      platform: linux
      arch: x86_64
